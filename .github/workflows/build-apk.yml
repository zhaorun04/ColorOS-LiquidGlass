name: Build ColorOS LiquidGlass Kyant LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK API 37 (including preview channel)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --list --channel=3 | grep -E 'platforms;android-37(\.[0-9]+)?' || true
          if "$SDKMANAGER" --list --channel=3 | grep -qE '^ *platforms;android-37 +\|'; then
            "$SDKMANAGER" --channel=3 --install 'platforms;android-37'
          elif "$SDKMANAGER" --list --channel=3 | grep -qE '^ *platforms;android-37\.1 +\|'; then
            "$SDKMANAGER" --channel=3 --install 'platforms;android-37.1'
          else
            echo 'ERROR: Android API 37 platform unavailable in SDK manager channel 3; cannot build current V283 Kyant dependencies with API 35.' >&2
            exit 1
          fi
          "$SDKMANAGER" --install 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Kyant integrated LSPosed module
        run: bash ./gradlew --no-daemon --stacktrace :liquidglass-module:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-LiquidGlass-V1.9.205.288.91-APK
          path: liquidglass-module/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
